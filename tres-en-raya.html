<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101829">
  <title>Tres en raya — Arcade Club</title>
  <style>
    :root { color-scheme:dark; --ink:#f5f2df; --muted:#a7b3c2; --mint:#78f0bc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px; color:var(--ink); font:15px/1.5 "Trebuchet MS",system-ui,sans-serif; background:radial-gradient(ellipse at 50% 0%,#263c58 0,#111a2b 55%,#0b1120 100%); }
    .shell { width:min(520px,100%); }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .back { color:var(--mint); font-weight:800; text-decoration:none; }
    .panel { padding:clamp(18px,5vw,32px); border:1px solid #32445c; border-radius:18px; background:linear-gradient(160deg,#1c2a40,#111b2b); box-shadow:0 18px 50px #05091488; text-align:center; }
    h1 { margin:0; font-size:clamp(26px,7vw,38px); }
    .hint { margin:4px 0 18px; color:var(--muted); }
    .score { display:flex; justify-content:space-around; margin-bottom:12px; color:var(--muted); font-weight:800; }
    .score strong { color:#ffd166; }
    .board { width:min(100%,360px); aspect-ratio:1; display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 auto; }
    .cell { display:grid; place-items:center; border:1px solid #435b75; border-radius:14px; color:var(--ink); background:#17263a; font-size:clamp(42px,14vw,76px); font-weight:900; cursor:pointer; }
    .cell:hover:enabled { border-color:var(--mint); background:#203746; }
    .cell:disabled { cursor:default; }
    .cell.x { color:#78f0bc; }
    .cell.o { color:#ffd166; }
    .cell.winning { border-color:var(--mint); background:#24464a; box-shadow:inset 0 0 0 2px var(--mint); }
    .cell:focus-visible { outline:3px solid #f5f2df; outline-offset:2px; }
    #status { min-height:25px; margin:15px 0; color:#d5dfeb; font-weight:700; }
    .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:9px; }
    button.action { border:0; border-radius:10px; padding:10px 16px; color:#172331; background:linear-gradient(#ffe08c,#ffc34f); box-shadow:0 4px 0 #b47528; font:900 14px "Trebuchet MS",system-ui,sans-serif; cursor:pointer; }
    button.action.secondary { color:var(--ink); background:#293b53; box-shadow:none; border:1px solid #51637a; }
    @media (max-width:420px) { body { padding:10px; } .panel { padding:17px 12px; } .board { gap:6px; } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top"><a class="back" href="./">← Todos los juegos</a><span>ARCADE CLUB</span></nav>
    <section class="panel">
      <h1>❎ Tres en raya</h1>
      <p class="hint">Dos jugadores · ¡Consigue tres en línea!</p>
      <div class="score"><span>❎ X: <strong id="score-x">0</strong></span><span>⭕ O: <strong id="score-o">0</strong></span></div>
      <div class="board" role="group" aria-label="Tablero de tres en raya">
        <button class="cell" type="button" aria-label="Casilla 1"></button>
        <button class="cell" type="button" aria-label="Casilla 2"></button>
        <button class="cell" type="button" aria-label="Casilla 3"></button>
        <button class="cell" type="button" aria-label="Casilla 4"></button>
        <button class="cell" type="button" aria-label="Casilla 5"></button>
        <button class="cell" type="button" aria-label="Casilla 6"></button>
        <button class="cell" type="button" aria-label="Casilla 7"></button>
        <button class="cell" type="button" aria-label="Casilla 8"></button>
        <button class="cell" type="button" aria-label="Casilla 9"></button>
      </div>
      <p id="status" aria-live="polite">Turno de X</p>
      <div class="actions"><button id="restart" class="action" type="button">NUEVA RONDA</button><button id="reset-score" class="action secondary" type="button">REINICIAR MARCADOR</button></div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const cells = [...document.querySelectorAll(".cell")];
      const status = document.getElementById("status");
      const scoreX = document.getElementById("score-x");
      const scoreO = document.getElementById("score-o");
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      let board = Array(9).fill("");
      let turn = "X", finished = false, totals = { X: 0, O: 0 };

      function play(index) {
        if (finished || board[index]) return;
        board[index] = turn;
        cells[index].textContent = turn === "X" ? "×" : "○";
        cells[index].classList.add(turn.toLowerCase());
        cells[index].setAttribute("aria-label", `Casilla ${index + 1}: ${turn}`);
        cells[index].disabled = true;
        const winner = wins.find(line => line.every(position => board[position] === turn));
        if (winner) {
          finished = true;
          winner.forEach(position => cells[position].classList.add("winning"));
          totals[turn]++;
          scoreX.textContent = String(totals.X);
          scoreO.textContent = String(totals.O);
          status.textContent = `¡${turn} gana la ronda!`;
          cells.forEach(cell => { cell.disabled = true; });
        } else if (board.every(Boolean)) {
          finished = true;
          status.textContent = "¡Empate! Nadie se lleva la ronda.";
        } else {
          turn = turn === "X" ? "O" : "X";
          status.textContent = `Turno de ${turn}`;
        }
      }

      function newRound() {
        board = Array(9).fill("");
        turn = "X";
        finished = false;
        status.textContent = "Turno de X";
        cells.forEach((cell, index) => {
          cell.textContent = "";
          cell.disabled = false;
          cell.className = "cell";
          cell.setAttribute("aria-label", `Casilla ${index + 1}`);
        });
      }

      cells.forEach((cell, index) => cell.addEventListener("click", () => play(index)));
      document.getElementById("restart").addEventListener("click", newRound);
      document.getElementById("reset-score").addEventListener("click", () => {
        totals = { X: 0, O: 0 };
        scoreX.textContent = "0";
        scoreO.textContent = "0";
        newRound();
      });
    })();
  </script>
</body>
</html>
