<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101829">
  <title>Astro Blaster — Arcade Club</title>
  <style>
    :root{color-scheme:dark;--ink:#f5f2df;--muted:#a7b3c2;--mint:#78f0bc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;color:var(--ink);font:15px/1.5 "Trebuchet MS",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#263c58 0,#111a2b 55%,#0b1120 100%)}
    .shell{width:min(820px,100%)}.top{display:flex;justify-content:space-between;margin-bottom:12px}
    a{color:var(--mint);font-weight:800;text-decoration:none}
    .panel{padding:clamp(12px,3vw,24px);border:1px solid #32445c;border-radius:18px;background:linear-gradient(160deg,#1c2a40,#111b2b);box-shadow:0 18px 50px #05091488}
    .heading{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:clamp(24px,5vw,36px)}.hint{margin:3px 0;color:var(--muted);font-size:13px}
    .stats{display:flex;justify-content:space-between;margin:9px 3px;color:var(--muted);font-weight:800}.stats b{color:#ffd166}
    canvas{display:block;width:100%;height:auto;border:2px solid #52667b;border-radius:10px;background:#090e20;touch-action:none}
    #status{text-align:center;min-height:24px;margin:9px 0;color:#d5dfeb}
    .actions{display:flex;justify-content:center}button{border:0;border-radius:10px;padding:10px 18px;color:#172331;background:linear-gradient(#ffe08c,#ffc34f);box-shadow:0 4px 0 #b47528;font:900 14px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
    .touch{display:none;justify-content:space-between;gap:9px;margin-top:12px}.touch-group{display:flex;gap:8px}.touch button{min-width:58px;padding:13px 10px;color:var(--ink);background:#293b53;border:1px solid #51637a;box-shadow:none;font-size:18px;touch-action:none}
    .touch .fire{color:#172331;border:0;background:linear-gradient(#ffe08c,#ffc34f);font-size:12px}
    @media(pointer:coarse){.touch{display:flex}}@media(max-width:540px){body{padding:8px}.panel{padding:10px}.heading{align-items:flex-start;flex-direction:column}.touch button{min-width:46px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top"><a href="./">← Todos los juegos</a><span>ARCADE CLUB</span></nav>
    <section class="panel">
      <div class="heading"><div><h1>🚀 Astro Blaster</h1><p class="hint">Defiende la galaxia, encadena combos y sobrevive a las oleadas.</p></div><span class="hint">WASD / FLECHAS · ESPACIO</span></div>
      <div class="stats"><span>PUNTOS <b id="score">0</b></span><span>OLEADA <b id="wave">1</b></span><span>VIDAS <b id="lives">3</b></span></div>
      <canvas id="game" width="800" height="520" aria-label="Juego espacial Astro Blaster"></canvas>
      <p id="status" aria-live="polite">Pulsa JUGAR · Muévete con WASD/flechas y dispara con espacio</p>
      <div class="actions"><button id="start" type="button">JUGAR</button></div>
      <div class="touch"><div class="touch-group"><button data-control="left" aria-label="Mover a la izquierda">◀</button><button data-control="right" aria-label="Mover a la derecha">▶</button></div><div class="touch-group"><button class="fire" data-control="fire" aria-label="Disparar">DISPARAR</button></div></div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const W=800,H=520,canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
      const scoreLabel=document.getElementById("score"),waveLabel=document.getElementById("wave"),livesLabel=document.getElementById("lives");
      const status=document.getElementById("status"),startButton=document.getElementById("start"),keys=new Set(),touch=new Set();
      let player={x:W/2,y:H-48,r:16},shots=[],enemies=[],sparks=[],score=0,lives=3,wave=1,fireTimer=0,spawnTimer=0,lastTime=0,frame=0,state="ready",waveWaiting=true,hitCooldown=0;
      let stars=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1}));
      const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
      const held=k=>keys.has(k)||touch.has(k);
      function drawShip(x,y,color,angle=Math.PI/2){
        ctx.save();ctx.translate(x,y);ctx.rotate(angle);
        ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-14,-12);ctx.lineTo(-8,0);ctx.lineTo(-14,12);ctx.closePath();ctx.fill();
        ctx.fillStyle="#eaf4ff";ctx.beginPath();ctx.ellipse(0,0,6,3,0,0,Math.PI*2);ctx.fill();ctx.restore();
      }
      function draw(){
        ctx.fillStyle="#090e20";ctx.fillRect(0,0,W,H);
        stars.forEach(s=>{ctx.fillStyle=`rgba(210,230,255,${.35+s.s*.2})`;ctx.fillRect(s.x,s.y,s.s,s.s*1.8);});
        ctx.strokeStyle="#ffffff12";ctx.lineWidth=1;
        for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
        shots.forEach(s=>{ctx.fillStyle=s.enemy?"#ff7896":"#7ef6ce";ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.fillRect(s.x-2,s.y-8,4,13);ctx.shadowBlur=0;});
        enemies.forEach(e=>drawShip(e.x,e.y,e.color,-Math.PI/2));
        sparks.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);});ctx.globalAlpha=1;
        drawShip(player.x,player.y,"#78f0bc");
        if(state==="ready"||state==="over"){
          ctx.fillStyle="#080d1dcc";ctx.fillRect(0,0,W,H);ctx.textAlign="center";
          ctx.fillStyle="#f5f2df";ctx.font="bold 38px system-ui";ctx.fillText(state==="ready"?"ASTRO BLASTER":"FIN DE PARTIDA",W/2,H/2-13);
          ctx.fillStyle="#c7d4e4";ctx.font="17px system-ui";ctx.fillText(state==="ready"?"Derriba las naves antes de que te alcancen":"Pulsa JUGAR para otra misión",W/2,H/2+23);
        }
      }
      function spawnWave(){
        waveLabel.textContent=String(wave);
        const count=4+Math.min(8,wave*2);
        for(let i=0;i<count;i++)enemies.push({x:55+(i%(count))*((W-110)/Math.max(1,count-1)),y:-30-Math.floor(i/8)*45,r:16,hp:1+Math.floor(wave/4),phase:Math.random()*6.28,color:["#ff8294","#ffd166","#a99bff","#73d8ff"][i%4],speed:45+wave*4});
      }
      function burst(x,y,color){
        for(let i=0;i<9;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*120;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,color});}
      }
      function start(){
        cancelAnimationFrame(frame);state="playing";player.x=W/2;shots=[];enemies=[];sparks=[];score=0;lives=3;wave=1;fireTimer=0;spawnTimer=.4;waveWaiting=true;hitCooldown=0;
        scoreLabel.textContent="0";livesLabel.textContent="3";startButton.textContent="REINICIAR";status.textContent="¡Oleada entrante!";
        lastTime=performance.now();frame=requestAnimationFrame(loop);
      }
      function finish(){state="over";startButton.textContent="JUGAR OTRA VEZ";status.textContent=`Misión terminada · Puntuación: ${score}`;draw();}
      function loop(time){
        if(state!=="playing")return;
        const dt=Math.min((time-lastTime)/1000,.03);lastTime=time;
        stars.forEach(s=>{s.y+=s.s*35*dt;if(s.y>H)s.y=0;});
        hitCooldown=Math.max(0,hitCooldown-dt);
        const move=(Number(held("ArrowRight")||held("KeyD"))-Number(held("ArrowLeft")||held("KeyA")))*330*dt;
        player.x=clamp(player.x+move,22,W-22);
        fireTimer-=dt;
        if((held("Space")||held("fire"))&&fireTimer<=0){shots.push({x:player.x,y:player.y-15,vy:-520});fireTimer=.19;}
        spawnTimer-=dt;if(waveWaiting&&spawnTimer<=0){spawnWave();waveWaiting=false;}
        enemies.forEach(e=>{e.y+=e.speed*dt;e.x+=Math.sin(time*.0015+e.phase)*55*dt;});
        shots.forEach(s=>{s.y+=s.vy*dt;});
        for(let i=shots.length-1;i>=0;i--){
          const s=shots[i];if(s.y<-15||s.y>H+15){shots.splice(i,1);continue;}
          if(s.enemy)continue;
          const hit=enemies.findIndex(e=>Math.hypot(e.x-s.x,e.y-s.y)<e.r+7);
          if(hit>=0){const e=enemies[hit];e.hp--;shots.splice(i,1);if(e.hp<=0){burst(e.x,e.y,e.color);enemies.splice(hit,1);score+=10;scoreLabel.textContent=String(score);} }
        }
        enemies=enemies.filter(e=>{
          if(e.y>H+20){lives--;livesLabel.textContent=String(lives);return false;}
          if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r&&hitCooldown<=0){burst(player.x,player.y,"#78f0bc");lives--;livesLabel.textContent=String(lives);hitCooldown=.8;return false;}
          return true;
        });
        sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});sparks=sparks.filter(p=>p.life>0);
        if(lives<=0){finish();return;}
        if(enemies.length===0&&!waveWaiting){wave++;waveLabel.textContent=String(wave);spawnTimer=.9;waveWaiting=true;}
        draw();frame=requestAnimationFrame(loop);
      }
      document.addEventListener("keydown",event=>{
        const key=event.code;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(key))event.preventDefault();
        keys.add(key);
      });
      document.addEventListener("keyup",event=>keys.delete(event.code));
      window.addEventListener("blur",()=>keys.clear());
      document.querySelectorAll("[data-control]").forEach(button=>{
        const action=button.dataset.control;
        button.addEventListener("pointerdown",event=>{event.preventDefault();button.setPointerCapture(event.pointerId);touch.add(action);});
        for(const type of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(type,()=>touch.delete(action));
      });
      startButton.addEventListener("click",start);draw();
    })();
  </script>
</body>
</html>
