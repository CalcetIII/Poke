<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101829">
  <title>Snake — Arcade Club</title>
  <style>
    :root { color-scheme: dark; --ink:#f5f2df; --muted:#a7b3c2; --mint:#78f0bc; --panel:#18243a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px; color:var(--ink); font:15px/1.5 "Trebuchet MS",system-ui,sans-serif; background:radial-gradient(ellipse at 50% 0%,#263c58 0,#111a2b 55%,#0b1120 100%); }
    .shell { width:min(560px,100%); }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .back { color:var(--mint); font-weight:800; text-decoration:none; }
    .panel { padding:clamp(16px,4vw,27px); border:1px solid #32445c; border-radius:18px; background:linear-gradient(160deg,#1c2a40,#111b2b); box-shadow:0 18px 50px #05091488; text-align:center; }
    h1 { margin:0; font-size:clamp(26px,7vw,38px); }
    .hint { margin:4px 0 17px; color:var(--muted); }
    .stats { display:flex; justify-content:space-between; max-width:400px; margin:0 auto 10px; color:var(--muted); }
    .stats strong { color:#ffd166; }
    canvas { display:block; width:min(100%,400px); height:auto; margin:0 auto; border:2px solid #52667b; border-radius:10px; background:#101c29; image-rendering:pixelated; }
    #message { min-height:26px; margin:10px 0; color:#d5dfeb; }
    .actions { display:flex; justify-content:center; gap:9px; }
    button { border:0; border-radius:10px; padding:10px 18px; color:#172331; background:linear-gradient(#ffe08c,#ffc34f); box-shadow:0 4px 0 #b47528; font:900 14px "Trebuchet MS",system-ui,sans-serif; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    .dpad { display:none; width:160px; margin:18px auto 0; grid-template-columns:repeat(3,1fr); gap:5px; }
    .dpad button { padding:9px 5px; color:var(--ink); background:#293b53; box-shadow:none; border:1px solid #51637a; font-size:18px; touch-action:manipulation; }
    @media (pointer:coarse) { .dpad { display:grid; } }
    @media (max-width:420px) { body { padding:10px; } .panel { padding:15px 11px; } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top"><a class="back" href="./">← Todos los juegos</a><span>ARCADE CLUB</span></nav>
    <section class="panel">
      <h1>🐍 Snake</h1>
      <p class="hint">Come las frutas. ¡No choques contigo mismo!</p>
      <div class="stats"><span>PUNTOS <strong id="score">0</strong></span><span>RÉCORD <strong id="best">0</strong></span></div>
      <canvas id="board" width="400" height="400" aria-label="Tablero del juego Snake"></canvas>
      <p id="message" aria-live="polite">Pulsa Jugar para empezar · Flechas o WASD</p>
      <div class="actions"><button id="start" type="button">JUGAR</button></div>
      <div class="dpad" aria-label="Controles táctiles">
        <span></span><button type="button" data-dir="up" aria-label="Arriba">↑</button><span></span>
        <button type="button" data-dir="left" aria-label="Izquierda">←</button><button type="button" data-dir="down" aria-label="Abajo">↓</button><button type="button" data-dir="right" aria-label="Derecha">→</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreLabel = document.getElementById("score");
      const bestLabel = document.getElementById("best");
      const message = document.getElementById("message");
      const startButton = document.getElementById("start");
      const size = 20, cells = canvas.width / size;
      const directions = {
        up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
        left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
      };
      let snake, food, direction, nextDirection, score = 0, best = 0, timer, running = false;
      bestLabel.textContent = String(best);

      function draw() {
        ctx.fillStyle = "#101c29";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#ffffff08";
        for (let i = 0; i <= cells; i++) {
          ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(canvas.width, i * size); ctx.stroke();
        }
        if (food) {
          ctx.fillStyle = "#ff7185";
          ctx.beginPath(); ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size * .38, 0, Math.PI * 2); ctx.fill();
        }
        if (snake) snake.forEach((part, i) => {
          ctx.fillStyle = i === 0 ? "#a3f5cb" : "#58c994";
          ctx.beginPath(); ctx.roundRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4, 5); ctx.fill();
        });
      }

      function placeFood() {
        const free = [];
        for (let y = 0; y < cells; y++) for (let x = 0; x < cells; x++) {
          if (!snake.some(part => part.x === x && part.y === y)) free.push({ x, y });
        }
        food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
      }

      function setDirection(name) {
        const next = directions[name];
        if (!next || (next.x === -direction.x && next.y === -direction.y)) return;
        nextDirection = next;
      }

      function finish(won = false) {
        running = false;
        clearInterval(timer);
        message.textContent = won ? "¡Has llenado todo el tablero! ¡Victoria!" : "¡Fin de la partida! Pulsa Jugar para intentarlo otra vez.";
        startButton.textContent = "JUGAR OTRA VEZ";
      }

      function step() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const eating = food && head.x === food.x && head.y === food.y;
        const body = eating ? snake : snake.slice(0, -1);
        if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells || body.some(part => part.x === head.x && part.y === head.y)) {
          finish(); return;
        }
        snake.unshift(head);
        if (eating) {
          score++;
          scoreLabel.textContent = String(score);
          if (score > best) { best = score; bestLabel.textContent = String(best); }
          placeFood();
          if (!food) { draw(); finish(true); return; }
        } else snake.pop();
        draw();
      }

      function start() {
        clearInterval(timer);
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = directions.right;
        nextDirection = direction;
        score = 0;
        scoreLabel.textContent = "0";
        message.textContent = "¡A por la fruta!";
        startButton.textContent = "REINICIAR";
        running = true;
        placeFood();
        draw();
        timer = setInterval(step, 125);
      }

      document.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();
        const map = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
        if (map[key]) { event.preventDefault(); if (running) setDirection(map[key]); }
      });
      document.querySelectorAll("[data-dir]").forEach(button => button.addEventListener("click", () => {
        if (running) setDirection(button.dataset.dir);
      }));
      startButton.addEventListener("click", start);
      draw();
    })();
  </script>
</body>
</html>
