<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101829">
  <title>Turbo Arena — Arcade Club</title>
  <style>
    :root { color-scheme:dark; --ink:#f5f2df; --muted:#a7b3c2; --mint:#78f0bc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:15px; color:var(--ink); font:15px/1.5 "Trebuchet MS",system-ui,sans-serif; background:radial-gradient(ellipse at 50% 0%,#263c58 0,#111a2b 55%,#0b1120 100%); }
    .shell { width:min(1060px,100%); }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    a { color:var(--mint); font-weight:800; text-decoration:none; }
    .panel { padding:clamp(12px,3vw,24px); border:1px solid #32445c; border-radius:18px; background:linear-gradient(160deg,#1c2a40,#111b2b); box-shadow:0 18px 50px #05091488; }
    .heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    h1 { margin:0; font-size:clamp(24px,5vw,36px); }
    .hint { margin:3px 0 0; color:var(--muted); font-size:13px; }
    .scoreboard { display:flex; justify-content:center; align-items:center; gap:18px; margin:4px 0 10px; font-size:clamp(23px,6vw,36px); font-weight:900; }
    .blue { color:#77d9ff; } .orange { color:#ffb86e; } .clock { color:#f5f2df; font-size:.65em; }
    canvas { display:block; width:100%; height:auto; border:2px solid #52667b; border-radius:10px; background:#142c35; touch-action:none; }
    #status { min-height:24px; margin:9px 0 10px; color:#d5dfeb; text-align:center; }
    .actions { display:flex; justify-content:center; gap:9px; }
    button { border:0; border-radius:10px; padding:10px 17px; color:#172331; background:linear-gradient(#ffe08c,#ffc34f); box-shadow:0 4px 0 #b47528; font:900 14px "Trebuchet MS",system-ui,sans-serif; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    .touch { display:none; justify-content:space-between; gap:10px; margin-top:12px; }
    .touch-group { display:flex; gap:7px; }
    .touch button { min-width:54px; padding:12px 9px; color:var(--ink); background:#293b53; border:1px solid #51637a; box-shadow:none; font-size:17px; touch-action:none; user-select:none; }
    .touch .boost { color:#172331; border:0; background:linear-gradient(#ffe08c,#ffc34f); font-size:12px; }
    @media(pointer:coarse) { .touch { display:flex; } }
    @media(max-width:600px) { body { padding:8px; } .panel { padding:10px; } .heading { align-items:flex-start; flex-direction:column; } .touch button { min-width:45px; } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top"><a href="./">← Todos los juegos</a><span>ARCADE CLUB</span></nav>
    <section class="panel">
      <div class="heading"><div><h1>🚗 Turbo Arena</h1><p class="hint">Fútbol de coches: acelera, salta, usa el turbo y marca.</p></div><span class="hint">1 JUGADOR · VS CPU</span></div>
      <div class="scoreboard"><span class="blue">AZUL <b id="blue-score">0</b></span><span class="clock" id="clock">90</span><span class="orange"><b id="orange-score">0</b> NARANJA</span></div>
      <canvas id="arena" width="960" height="500" aria-label="Campo de fútbol de coches"></canvas>
      <p id="status" aria-live="polite">Pulsa JUGAR · WASD/Flechas para conducir · Espacio para saltar · Shift para turbo</p>
      <div class="actions"><button id="start" type="button">JUGAR</button></div>
      <div class="touch" aria-label="Controles táctiles">
        <div class="touch-group"><button data-key="ArrowLeft" aria-label="Girar a la izquierda">◀</button><button data-key="ArrowRight" aria-label="Girar a la derecha">▶</button></div>
        <div class="touch-group"><button data-key="ArrowUp" aria-label="Acelerar">▲</button><button data-key="Space" aria-label="Saltar">⤒</button><button class="boost" data-key="Shift" aria-label="Turbo">TURBO</button></div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const W=960,H=500,FLOOR=438,GOAL_TOP=300,GOAL_DEPTH=78,GRAVITY=1050;
      const canvas=document.getElementById("arena"),ctx=canvas.getContext("2d");
      const blueScoreLabel=document.getElementById("blue-score"),orangeScoreLabel=document.getElementById("orange-score");
      const clockLabel=document.getElementById("clock"),status=document.getElementById("status"),startButton=document.getElementById("start");
      const keys=new Set();
      const player={x:170,y:FLOOR-22,vx:0,vy:0,angle:0,boost:100,grounded:true,color:"#62d6ff",team:"blue",radius:28};
      const cpu={x:790,y:FLOOR-22,vx:0,vy:0,angle:Math.PI,boost:100,grounded:true,color:"#ffad61",team:"orange",radius:28};
      const ball={x:W/2,y:FLOOR-16,vx:0,vy:0,r:17};
      let scores={blue:0,orange:0},timeLeft=90,lastTime=0,frame=0,state="ready",goalPause=0;
      const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
      const length=(x,y)=>Math.hypot(x,y);

      function drawCar(car) {
        ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);
        ctx.shadowColor=car.color;ctx.shadowBlur=14;
        ctx.fillStyle=car.color;ctx.beginPath();ctx.roundRect(-31,-14,62,28,8);ctx.fill();
        ctx.shadowBlur=0;ctx.fillStyle="#132238";ctx.beginPath();ctx.roundRect(-7,-12,22,14,5);ctx.fill();
        ctx.fillStyle="#f5f2df";ctx.fillRect(20,-9,5,5);ctx.fillRect(20,5,5,5);
        ctx.fillStyle="#111827";
        ctx.beginPath();ctx.arc(-17,13,7,0,Math.PI*2);ctx.arc(18,13,7,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="#bbc8d8";
        ctx.beginPath();ctx.arc(-17,13,3,0,Math.PI*2);ctx.arc(18,13,3,0,Math.PI*2);ctx.fill();
        if(car===player) {
          ctx.rotate(-car.angle);
          ctx.fillStyle="#eaf3ff";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText("P1",car.x,car.y-39);
          ctx.fillStyle="#26384a";ctx.fillRect(car.x-25,car.y-34,50,5);
          ctx.fillStyle="#ffd166";ctx.fillRect(car.x-25,car.y-34,50*car.boost/100,5);
        }
        ctx.restore();
      }

      function draw() {
        const sky=ctx.createLinearGradient(0,0,0,FLOOR);
        sky.addColorStop(0,"#172642");sky.addColorStop(1,"#234354");
        ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#ffffff0a";
        for(let i=0;i<32;i++){const x=(i*127)%W,y=35+(i*61)%235;ctx.fillRect(x,y,2,2);}
        ctx.fillStyle="#255044";ctx.fillRect(0,FLOOR,W,H-FLOOR);
        ctx.fillStyle="#2e6652";
        for(let i=0;i<12;i++)if(i%2===0)ctx.fillRect(i*80,FLOOR,80,H-FLOOR);
        ctx.strokeStyle="#b9f4d65c";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();
        ctx.setLineDash([12,12]);ctx.strokeStyle="#e5f4dd55";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,FLOOR);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
        ctx.beginPath();ctx.arc(W/2,FLOOR,62,Math.PI,0);ctx.stroke();
        ctx.fillStyle="#172e39";ctx.fillRect(0,GOAL_TOP,GOAL_DEPTH,FLOOR-GOAL_TOP);
        ctx.fillRect(W-GOAL_DEPTH,GOAL_TOP,GOAL_DEPTH,FLOOR-GOAL_TOP);
        ctx.strokeStyle="#77d9ff";ctx.lineWidth=6;ctx.strokeRect(0,GOAL_TOP,GOAL_DEPTH,FLOOR-GOAL_TOP);
        ctx.strokeStyle="#ffb86e";ctx.strokeRect(W-GOAL_DEPTH,GOAL_TOP,GOAL_DEPTH,FLOOR-GOAL_TOP);
        ctx.fillStyle="#ffffff22";ctx.beginPath();ctx.arc(W/2,FLOOR-1,4,0,Math.PI*2);ctx.fill();
        drawCar(player);drawCar(cpu);
        ctx.save();ctx.translate(ball.x,ball.y);
        ctx.shadowColor="#ffffff";ctx.shadowBlur=13;ctx.fillStyle="#f6f1df";
        ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;ctx.strokeStyle="#586879";ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(0,0,ball.r*.56,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(-ball.r*.8,0);ctx.lineTo(ball.r*.8,0);ctx.moveTo(0,-ball.r*.8);ctx.lineTo(0,ball.r*.8);ctx.stroke();
        ctx.restore();
        if(state==="ready"||state==="over") {
          ctx.fillStyle="#09101dbb";ctx.fillRect(0,0,W,H);
          ctx.textAlign="center";ctx.fillStyle="#f5f2df";ctx.font="bold 36px system-ui";
          ctx.fillText(state==="ready"?"TURBO ARENA":(scores.blue>scores.orange?"¡VICTORIA AZUL!":scores.blue<scores.orange?"GANA NARANJA":"¡EMPATE!"),W/2,H/2-12);
          ctx.fillStyle="#cfdae8";ctx.font="17px system-ui";
          ctx.fillText(state==="ready"?"Marca más goles que la CPU antes de que acabe el tiempo":"Pulsa JUGAR para una nueva partida",W/2,H/2+24);
        }
      }

      function resetPositions(direction=1) {
        player.x=170;player.y=FLOOR-22;player.vx=0;player.vy=0;player.angle=0;player.grounded=true;
        cpu.x=790;cpu.y=FLOOR-22;cpu.vx=0;cpu.vy=0;cpu.angle=Math.PI;cpu.grounded=true;
        ball.x=W/2;ball.y=FLOOR-17;ball.vx=direction*95;ball.vy=-70;
        goalPause=.9;
      }
      function begin() {
        cancelAnimationFrame(frame);scores={blue:0,orange:0};timeLeft=90;state="playing";
        blueScoreLabel.textContent="0";orangeScoreLabel.textContent="0";clockLabel.textContent="90";
        startButton.textContent="REINICIAR";status.textContent="¡A por el balón!";
        player.boost=100;cpu.boost=100;resetPositions(Math.random()<.5?-1:1);
        lastTime=performance.now();frame=requestAnimationFrame(loop);
      }
      function goal(team) {
        scores[team]++;
        blueScoreLabel.textContent=String(scores.blue);orangeScoreLabel.textContent=String(scores.orange);
        status.textContent=team==="blue"?"¡GOOOL AZUL!":"¡Gol de la CPU!";
        resetPositions(team==="blue"?-1:1);
      }
      function moveCar(car,dt,isCpu=false) {
        if(car.grounded) {
          if(!isCpu) {
            if(keys.has("arrowleft")||keys.has("a"))car.angle-=2.7*dt;
            if(keys.has("arrowright")||keys.has("d"))car.angle+=2.7*dt;
          } else {
            const target=Math.atan2(ball.y-car.y,ball.x-car.x);
            let diff=Math.atan2(Math.sin(target-car.angle),Math.cos(target-car.angle));
            car.angle+=clamp(diff,-2.1*dt,2.1*dt);
          }
        }
        const boostPressed=!isCpu&&keys.has("shift");
        const reverse=!isCpu&&(keys.has("arrowdown")||keys.has("s"));
        const wantsDrive=isCpu?Math.abs(ball.x-car.x)>48:(keys.has("arrowup")||keys.has("w")||reverse);
        if(wantsDrive) {
          let thrust=isCpu?600:490;
          if(boostPressed&&car.boost>0){thrust=900;car.boost=Math.max(0,car.boost-35*dt);}
          else if(!isCpu)car.boost=Math.min(100,car.boost+13*dt);
          const driveDirection=reverse?-1:1;
          car.vx+=Math.cos(car.angle)*thrust*dt*driveDirection;
          car.vy+=Math.sin(car.angle)*thrust*dt*driveDirection;
        } else if(!isCpu) car.boost=Math.min(100,car.boost+20*dt);
        const jumpKey=keys.has(" ");
        if(!isCpu&&jumpKey&&car.grounded){car.vy=-440;car.grounded=false;}
        if(isCpu&&car.grounded&&Math.abs(ball.x-car.x)<185&&ball.y<car.y-25&&Math.random()<dt*1.6){car.vy=-390;car.grounded=false;}
        if(isCpu&&ball.x<car.x-45&&car.grounded)car.vx-=240*dt;
        car.vx*=Math.pow(car.grounded?.985:.995,dt*60);
        car.vy+=GRAVITY*dt;
        car.x+=car.vx*dt;car.y+=car.vy*dt;
        if(car.y>=FLOOR-22){car.y=FLOOR-22;car.vy=0;car.grounded=true;}
        if(car.y<35){car.y=35;car.vy=Math.abs(car.vy)*.45;}
        car.x=clamp(car.x,34,W-34);
        if(car.x<GOAL_DEPTH+15&&car.y>GOAL_TOP&&car.y<FLOOR-4)car.x=GOAL_DEPTH+15;
        if(car.x>W-GOAL_DEPTH-15&&car.y>GOAL_TOP&&car.y<FLOOR-4)car.x=W-GOAL_DEPTH-15;
        const maxSpeed=boostPressed?660:460, speed=length(car.vx,car.vy);
        if(speed>maxSpeed){car.vx=car.vx/speed*maxSpeed;car.vy=car.vy/speed*maxSpeed;}
      }
      function collideCarBall(car) {
        const dx=ball.x-car.x,dy=ball.y-car.y,d=length(dx,dy),min=ball.r+car.radius*.78;
        if(d<min&&d>0) {
          const nx=dx/d,ny=dy/d,overlap=min-d;
          ball.x+=nx*overlap;ball.y+=ny*overlap;
          const relative=(ball.vx-car.vx)*nx+(ball.vy-car.vy)*ny;
          if(relative<0){ball.vx-=1.65*relative*nx;ball.vy-=1.65*relative*ny;}
          ball.vx+=car.vx*.48;ball.vy+=car.vy*.4-35;
          const speed=length(ball.vx,ball.vy);
          if(speed>900){ball.vx=ball.vx/speed*900;ball.vy=ball.vy/speed*900;}
        }
      }
      function updateBall(dt) {
        ball.vy+=GRAVITY*.8*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
        ball.vx*=Math.pow(.998,dt*60);
        if(ball.y-ball.r<15){ball.y=15+ball.r;ball.vy=Math.abs(ball.vy)*.82;}
        if(ball.y+ball.r>FLOOR){ball.y=FLOOR-ball.r;ball.vy=-Math.abs(ball.vy)*.72;if(Math.abs(ball.vy)<30)ball.vy=0;}
        if(ball.x-ball.r<0&&!(ball.y>GOAL_TOP+ball.r&&ball.y<FLOOR-ball.r)){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.75;}
        if(ball.x+ball.r>W&&!(ball.y>GOAL_TOP+ball.r&&ball.y<FLOOR-ball.r)){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.75;}
        if(ball.y>GOAL_TOP+ball.r&&ball.y<FLOOR-ball.r) {
          if(ball.x<GOAL_DEPTH+ball.r&&ball.vx<0){ball.x=GOAL_DEPTH+ball.r;ball.vx=Math.abs(ball.vx)*.68;}
          if(ball.x>W-GOAL_DEPTH-ball.r&&ball.vx>0){ball.x=W-GOAL_DEPTH-ball.r;ball.vx=-Math.abs(ball.vx)*.68;}
        }
        if(ball.x<-ball.r)goal("orange");
        else if(ball.x>W+ball.r)goal("blue");
      }
      function loop(time) {
        if(state!=="playing")return;
        const dt=Math.min((time-lastTime)/1000,.025);lastTime=time;
        timeLeft=Math.max(0,timeLeft-dt);clockLabel.textContent=String(Math.ceil(timeLeft));
        if(timeLeft<=0){state="over";startButton.textContent="JUGAR OTRA VEZ";status.textContent=scores.blue===scores.orange?"¡Se acabó! Empate.":scores.blue>scores.orange?"¡Se acabó! Ganaste el partido.":"¡Se acabó! La CPU se lleva el partido.";draw();return;}
        moveCar(player,dt);moveCar(cpu,dt,true);
        if(goalPause>0)goalPause=Math.max(0,goalPause-dt);
        else {updateBall(dt);collideCarBall(player);collideCarBall(cpu);}
        draw();frame=requestAnimationFrame(loop);
      }
      document.addEventListener("keydown",event=>{
        const key=event.key===" "?" ":event.key.toLowerCase();
        if(["arrowleft","arrowright","arrowup","arrowdown"," ","shift"].includes(key)){event.preventDefault();keys.add(key);}
      });
      document.addEventListener("keyup",event=>keys.delete(event.key===" "?" ":event.key.toLowerCase()));
      window.addEventListener("blur",()=>keys.clear());
      document.querySelectorAll("[data-key]").forEach(button=>{
        const key=button.dataset.key==="Space"?" ":button.dataset.key.toLowerCase();
        button.addEventListener("pointerdown",event=>{event.preventDefault();keys.add(key);button.setPointerCapture(event.pointerId);});
        for(const type of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(type,()=>keys.delete(key));
      });
      startButton.addEventListener("click",begin);
      resetPositions(1);goalPause=0;draw();
    })();
  </script>
</body>
</html>
